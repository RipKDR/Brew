name: Brew Build

# Triggered on version tags only
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  pre-build-checks:
    name: Pre-Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate levels
        run: |
          python scripts/build/build_config.py \
            --project-root . \
            --levels-dir levels/ \
            --level-range 1-40

      - name: Validate economy pacing
        run: |
          python scripts/economy-sim/simulate_economy.py \
            --days 50 \
            --levels-per-day 10 \
            --star-average 2.0 \
            --win-rate 0.7 \
            --streak-average 3 \
            --quiet

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.version.outputs.version }}

  trigger-unity-build:
    name: Trigger Unity Cloud Build
    needs: pre-build-checks
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build (placeholder)
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  Unity Cloud Build — Trigger Placeholder"
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "  Version: ${{ needs.pre-build-checks.outputs.version }}"
          echo ""
          echo "  To enable actual Unity Cloud Build triggers:"
          echo ""
          echo "  1. Add these repository secrets:"
          echo "     - UNITY_ORG_ID:     Your Unity org ID"
          echo "     - UNITY_PROJECT_ID: Your Unity project ID"
          echo "     - UNITY_API_KEY:    Unity Cloud Build API key"
          echo ""
          echo "  2. Replace this step with an API call:"
          echo ""
          echo '     curl -X POST \'
          echo '       "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/_all/builds" \'
          echo '       -H "Authorization: Basic ${UNITY_API_KEY}" \'
          echo '       -H "Content-Type: application/json" \'
          echo '       -d '"'"'{"clean": false, "delay": 0}'"'"
          echo ""
          echo "  3. Optionally poll for build completion:"
          echo ""
          echo '     curl "https://build-api.cloud.unity3d.com/api/v1/orgs/${UNITY_ORG_ID}/projects/${UNITY_PROJECT_ID}/buildtargets/_all/builds?per_page=1" \'
          echo '       -H "Authorization: Basic ${UNITY_API_KEY}"'
          echo ""
          echo "═══════════════════════════════════════════════════"

  notify:
    name: Build Notification
    needs: [pre-build-checks, trigger-unity-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification (placeholder)
        run: |
          VERSION="${{ needs.pre-build-checks.outputs.version }}"
          STATUS="${{ needs.trigger-unity-build.result }}"

          echo "Sending build notification..."
          echo "  Version: ${VERSION}"
          echo "  Status:  ${STATUS}"
          echo ""
          echo "  To enable real notifications, replace this with:"
          echo ""
          echo "  curl -X POST \${{ secrets.WEBHOOK_URL }} \\"
          echo "    -H 'Content-Type: application/json' \\"
          echo "    -d '{\"text\": \"Brew ${VERSION} build ${STATUS}\"}'"
          echo ""
          echo "  Supports Slack, Discord, or any webhook endpoint."

          # Placeholder webhook call (will no-op without the secret)
          # curl -X POST "${{ secrets.WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"text\": \"Brew v${VERSION} build ${STATUS}\"}"
