name: Brew Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  pre-build-checks:
    name: Pre-Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate levels
        run: |
          python scripts/build/build_config.py \
            --project-root . \
            --levels-dir Assets/_Project/Resources/Levels/ \
            --level-range 1-40

      - name: Validate economy pacing
        run: |
          python scripts/economy-sim/simulate_economy.py \
            --days 50 \
            --levels-per-day 10 \
            --star-average 2.0 \
            --win-rate 0.7 \
            --streak-average 3 \
            --quiet

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.version.outputs.version }}

  build-android:
    name: Build Android
    needs: pre-build-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.4.1f1
          buildName: Brew
          versioning: Custom
          version: ${{ needs.pre-build-checks.outputs.version }}
          androidAppBundle: true
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/Android

  build-ios:
    name: Build iOS
    needs: pre-build-checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.4.1f1
          buildName: Brew
          versioning: Custom
          version: ${{ needs.pre-build-checks.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/iOS

  deploy-android:
    name: Deploy Android to Play Console
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: build/Android

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.brew.puzzle
          releaseFiles: build/Android/*.aab
          track: internal

  deploy-ios:
    name: Deploy iOS to TestFlight
    needs: build-ios
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: build/iOS

      - name: Install Fastlane
        run: gem install fastlane

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          cd build/iOS
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath Brew.xcarchive \
            CODE_SIGN_IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE }}"

          xcodebuild -exportArchive \
            -archivePath Brew.xcarchive \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -exportPath export/

          fastlane pilot upload \
            --ipa "export/Brew.ipa" \
            --skip_waiting_for_build_processing true

  notify:
    name: Build Notification
    needs: [pre-build-checks, build-android, build-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        run: |
          VERSION="${{ needs.pre-build-checks.outputs.version }}"
          ANDROID="${{ needs.build-android.result }}"
          IOS="${{ needs.build-ios.result }}"

          echo "Build v${VERSION}: Android=${ANDROID}, iOS=${IOS}"

          if [ -n "${{ secrets.WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"Brew v${VERSION} — Android: ${ANDROID}, iOS: ${IOS}\"}" || true
          fi
